brand_intel_refresh_task:
  description: |
    Refresh X3P brand intelligence from x3p.ai using live sources and existing context.
    Existing brand snapshot context: {brand_snapshot}
    Brand guide baseline: {brand_guide}

    Instructions:
    - Use x3p_site_snapshot_tool to fetch and inspect x3p.ai pages.
    - Produce a concise, factual brand brief suitable for downstream content generation.
    - Include what X3P does, target audiences, value proposition, and guardrails.
    - Do not invent claims not grounded in fetched site content.

    Output only JSON with keys:
    - captured_at
    - source_count
    - core_messages (array)
    - offerings (array)
    - audiences (array)
    - tone_notes (array)
    - proof_points (array of objects with claim + evidence_id)
    - do_not_say (array)
    - citation_index (array of objects with evidence_id + url + note)
  expected_output: >
    A JSON brand snapshot brief grounded in x3p.ai sources.
  agent: brand_intel_analyst

trend_brief_task:
  description: |
    Build a strictly verified social trend brief for X3P.
    Topic: {topic}
    Audience: {audience}
    Tone: {tone}
    Trend recency window (days): {trend_window_days}
    Brand snapshot: {brand_snapshot}

    Instructions:
    - Use social_trends_tool to identify candidate trend signals.
    - Verify each candidate claim with trend_verifier_tool.
    - Keep only claims with at least 2 independent sources.
    - Drop any claim that cannot be verified.

    Output only JSON with keys:
    - generated_at
    - trend_window_days
    - kept_claims (array of objects with claim + evidence_ids + rationale)
    - dropped_claims (array of objects with claim + reason)
    - citation_index (array of objects with evidence_id + url + domain + published_at)
  expected_output: >
    A strict, citation-backed trend brief for social generation.
  agent: trend_intel_analyst

strategy_outline_task:
  description: |
    Use the project brief and brand guidelines if provided in inputs.
    Brief: {brief}
    Brand guide: {brand_guide}
    Brand snapshot: {brand_snapshot}
    Topic: {topic}
    Audience: {audience}
    Tone: {tone}
    Produce a concise narrative-first outline for a blog post about X3P and good jobs.

    Respond with Markdown only. No code fences. No Thought/Action logs.

    Required headings (exactly):
    ## Working title
    ## Opening vignette
    ## Section 1 — Opportunity Gap
    ## Section 2 — X3P in Action
    ## Section 3 — Proof & Momentum
    ## How it works
    ## CTA

    Rules:
    - Do not invent statistics, partner names, dates, or policy claims.
    - If evidence is uncertain, state "Evidence pending verification".
    - Keep the outline concise and ready for drafting.
  expected_output: >
    A markdown strategy outline with all required headings.
  agent: strategist

writing_task:
  description: |
    Write a narrative-first blog draft using this context:
    Brief: {brief}
    Brand guide: {brand_guide}
    Brand snapshot: {brand_snapshot}
    Topic: {topic}
    Audience: {audience}
    Tone: {tone}
    Key facts: {key_facts}
    Preferred title (optional): {preferred_title}
    Angle (optional): {angle_choice}

    Output Markdown with this exact structure:
    1) YAML front matter
    ---
    title: "..."
    description: "..."
    slug: ...
    date: {current_year}-09-20
    author: "X3P Team"
    tags:
      - ...
      - ...
      - ...
    ---

    2) Narrative body with exact headings:
    ### Opportunity Gap
    ### How X3P Builds Good Jobs
    ### Outcomes & Partnerships

    3) CTA paragraph containing both:
    - Visit x3p.ai
    - partnerships@x3p.ai

    4) Final section:
    ## Sources
    - [evidence_id] Source Name — [Title](URL)

    Rules:
    - No fabricated sources, stats, dates, or institutions.
    - Every concrete claim must map to an evidence_id in Sources.
    - Keep prose paragraph-driven (not list-heavy).
  expected_output: >
    A complete blog markdown draft with required headings and sources.
  agent: content_writer

editing_task:
  description: |
    Edit the blog for publication quality and strict format compliance.
    Brief: {brief}
    Brand guide: {brand_guide}
    Brand snapshot: {brand_snapshot}
    Draft to edit: {blog_post}
    Fact-check findings (if available): {factcheck_report}
    Brand report (if available): {brand_report}

    Keep and repair the required structure if needed:
    - YAML front matter
    - ### Opportunity Gap
    - ### How X3P Builds Good Jobs
    - ### Outcomes & Partnerships
    - CTA containing Visit x3p.ai and partnerships@x3p.ai
    - ## Sources

    Output only final markdown. No reviewer notes.
  expected_output: >
    A clean publication-ready blog markdown document.
  agent: editor

social_media_task:
  description: |
    Create platform-ready social copy from X3P narrative context.
    Brief: {brief}
    Brand guide: {brand_guide}
    Brand snapshot: {brand_snapshot}
    Verified trend brief: {trend_brief}
    Topic: {topic}
    Audience: {audience}
    Tone: {tone}
    Key facts: {key_facts}
    Blog context: {blog_post}
    Fact-check findings: {factcheck_report}
    Brand report: {brand_report}

    Output only markdown with these exact section headings:
    ## LinkedIn post 1
    ## LinkedIn post 2
    ## Facebook post 1
    ## Facebook post 2
    ## Instagram caption 1
    ## Instagram caption 2

    Each section must include:
    - A strong hook
    - 1–2 proof sentences with [evidence_id]
    - A CTA ending with "Visit x3p.ai"
    - A hashtags line: "Hashtags: ..."

    Instagram captions must include:
    - "Suggested visual: ..."

    Rules:
    - No claim without a valid [evidence_id] mapped in trend_brief or sources.
    - No fabricated metrics or dates.
    - No tool traces or debugging text.
  expected_output: >
    A markdown package containing LinkedIn, Facebook, and Instagram copy.
  agent: social_media_manager

fact_check_task:
  description: |
    Fact-check blog and social outputs with high source discipline.
    Trusted domains: {trusted_domains}
    Blog draft: {blog_post}
    Social draft: {social_outputs}
    Trend brief: {trend_brief}

    Output must start with a one-line JSON header (no code fence):
    {"severity":"NONE|MINOR|MAJOR|CRITICAL","issues":N,"summary":"..."}

    Then include a markdown table with columns:
    - Claim
    - Status (Verified | Weak | Unsupported)
    - Action (Keep | Soften | Remove)
    - Evidence URL

    Rules:
    - Unsupported claim => mark Unsupported and recommend Soften/Remove.
    - Avoid filler text; keep concrete and actionable.
  expected_output: >
    A severity-tagged fact-check report in markdown.
  agent: fact_checker

brandcheck_task:
  description: |
    Review outputs for brand alignment and risky tone.
    Brief: {brief}
    Brand guide: {brand_guide}
    Brand snapshot: {brand_snapshot}
    Blog draft: {blog_post}
    Social draft: {social_outputs}

    Output must start with a one-line JSON header (no code fence):
    {"severity":"NONE|MINOR|MAJOR|CRITICAL","issues":N,"summary":"..."}

    Then provide concise markdown findings with concrete fixes.

    Rules:
    - Flag overclaims, off-brand framing, and certainty language without support.
    - Keep findings practical and publish-oriented.
  expected_output: >
    A brand review report in markdown with severity header.
  agent: brand_guardian
